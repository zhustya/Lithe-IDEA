<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git Graph</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <select id="repo" aria-label="Repository"></select>
    <button id="refresh" type="button" title="Refresh">&#8635;</button>
    <select id="limit" aria-label="Commit count">
      <option value="100">100</option>
      <option value="200" selected>200</option>
      <option value="500">500</option>
      <option value="1000">1000</option>
    </select>
    <input id="search" type="search" placeholder="Search commits…" aria-label="Search commits">
  </header>
  <div id="status" class="status"></div>
  <main class="content">
    <div class="graph-scroll">
      <div id="graph" class="graph"></div>
    </div>
    <section id="detail" class="detail" hidden>
      <div id="detail-head" class="detail-head"></div>
      <div id="detail-message" class="detail-message"></div>
      <div id="detail-files" class="detail-files"></div>
    </section>
  </main>
</body>
</html>
